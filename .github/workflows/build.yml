```yaml
name: Build STRIKE FORCE IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project STRIKEFORCE.xcodeproj \
            -scheme STRIKEFORCE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/STRIKE_FORCE.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry STRIKE_FORCE.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STRIKE-FORCE-IPA-UNSIGNED
          path: STRIKE_FORCE.ipa
          if-no-files-found: error
          retention-days: 14
```
